name: Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run smoke tests
        run: pytest tests/test_smoke.py tests/test_integration.py -v

  # Job preparado para Fase 4 (VPS + Nginx + HTTPS).
  # Desabilitado enquanto a VPS não existe — sem os secrets SERVER_HOST,
  # SERVER_USER, SSH_PRIVATE_KEY configurados no repo, este job sempre
  # falha e pinta TODA run de vermelho, escondendo se os testes passaram.
  #
  # Para habilitar: criar os 3 secrets no GitHub e mudar 'false' para 'true'.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/monitor-micro
            git pull
            docker compose down
            docker compose up -d --build
